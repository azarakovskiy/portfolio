<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Throwaway UI prototype exploring three recruiter-first portfolio layouts for Alexey Zarakovskiy."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Alexey Zarakovskiy: Portfolio prototype</title>
    <style>
      /*
       * THROWAWAY UI PROTOTYPE
       * Question: what should a recruiter-first freelance SWE portfolio look like?
       * Three readable variants switch via ?variant= on /prototype/portfolio/.
       * Current direction: A's editorial layout with B's technical profile.
       */
      :root {
        color-scheme: light dark;
        --bg: #f7f9f6;
        --surface: #ffffff;
        --surface-muted: #eef3ed;
        --text: #172019;
        --text-soft: #526057;
        --text-faint: #6c7a70;
        --line: #d7e0d8;
        --line-strong: #afc0b2;
        --accent: #287047;
        --accent-soft: #e4f0e5;
        --focus: #a96600;
        --bar: #172019;
        --bar-text: #f7fbf6;
        --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121713;
          --surface: #18201b;
          --surface-muted: #202b23;
          --text: #eef5ee;
          --text-soft: #b6c3b8;
          --text-faint: #91a096;
          --line: #2e3d32;
          --line-strong: #4c5f4f;
          --accent: #9fd176;
          --accent-soft: #273b29;
          --focus: #f2c068;
          --bar: #e8f1e8;
          --bar-text: #172019;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        line-height: 1.55;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        color: var(--accent);
      }

      button,
      summary {
        font: inherit;
      }

      button {
        color: inherit;
      }

      ::selection {
        background: var(--accent);
        color: var(--surface);
      }

      a:focus-visible,
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
      }

      .mono,
      .eyebrow,
      .section-kicker,
      .project-meta,
      .project-number,
      .metric-label,
      .case-notes summary,
      .tag,
      .switcher-label {
        font-family: var(--mono);
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .eyebrow,
      .section-kicker {
        margin: 0;
        color: var(--accent);
        font-size: 0.7rem;
        font-weight: 700;
      }

      .muted {
        color: var(--text-soft);
      }

      .brand {
        display: inline-flex;
        flex-direction: column;
        width: fit-content;
        gap: 1px;
      }

      .brand-name {
        font-size: 1rem;
        font-weight: 750;
        letter-spacing: -0.035em;
      }

      .brand-role {
        color: var(--text-soft);
        font-size: 0.75rem;
      }

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 25px;
        min-height: 84px;
        border-bottom: 1px solid var(--line);
      }

      .page-header nav {
        display: flex;
        gap: 22px;
        color: var(--text-soft);
        font-size: 0.85rem;
      }

      .page-header nav a {
        border-bottom: 1px solid transparent;
      }

      .page-header nav a:hover {
        border-bottom-color: var(--accent);
      }

      .header-meta {
        display: flex;
        align-items: center;
        gap: 17px;
        white-space: nowrap;
      }


      .availability {
        padding-bottom: 2px;
        border-bottom: 1px solid var(--accent);
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 650;
      }

      .section-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(250px, 0.65fr);
        align-items: end;
        gap: 45px;
        padding-bottom: 33px;
      }

      .section-heading h2 {
        margin: 10px 0 0;
        font-size: clamp(2rem, 4vw, 3.5rem);
        line-height: 1;
        letter-spacing: -0.07em;
      }

      .section-intro {
        max-width: 420px;
        margin: 0;
        color: var(--text-soft);
        font-size: 0.98rem;
      }

      .project-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px 13px;
        color: var(--text-faint);
        font-size: 0.65rem;
      }

      .project-meta span + span::before {
        margin-right: 13px;
        color: var(--line-strong);
        content: "/";
      }

      .project-summary,
      .project-story {
        max-width: 700px;
        margin: 0;
        color: var(--text-soft);
        font-size: 1rem;
        line-height: 1.55;
      }

      .project-story {
        margin-top: 9px;
        color: var(--text);
      }

      .project-title {
        margin: 9px 0 11px;
        font-size: clamp(1.45rem, 3vw, 2.25rem);
        line-height: 1.05;
        letter-spacing: -0.06em;
      }

      .project-number {
        padding-top: 4px;
        color: var(--accent);
        font-size: 0.68rem;
      }

      .project-proof {
        display: grid;
        align-content: start;
        gap: 15px;
      }

      .metric {
        display: grid;
        gap: 1px;
      }

      .metric-value {
        font-size: 1.05rem;
        font-weight: 750;
        letter-spacing: -0.035em;
      }

      .metric-label {
        color: var(--text-faint);
        font-size: 0.58rem;
        line-height: 1.35;
      }

      .case-notes {
        margin-top: 24px;
        border-top: 1px solid var(--line);
      }

      .case-notes summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 46px;
        cursor: pointer;
        list-style: none;
        color: var(--text-soft);
        font-size: 0.64rem;
      }

      .case-notes summary::-webkit-details-marker {
        display: none;
      }

      .case-notes summary::after {
        color: var(--accent);
        content: "+";
        font-family: var(--sans);
        font-size: 1.15rem;
        letter-spacing: 0;
        text-transform: none;
      }

      .case-notes[open] summary::after {
        content: "−";
      }


      .details-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px 35px;
        padding: 16px 0 5px;
      }

      .detail-label {
        display: block;
        margin-bottom: 5px;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.63rem;
        font-weight: 700;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .detail-block p {
        margin: 0;
        color: var(--text-soft);
        font-size: 0.92rem;
        line-height: 1.55;
      }

      .case-footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 25px;
        margin-top: 24px;
        padding-top: 17px;
        border-top: 1px solid var(--line);
      }

      .case-footer-label {
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        justify-content: end;
        gap: 6px;
      }

      .tag {
        padding: 4px 7px;
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--text-soft);
        font-size: 0.58rem;
      }

      .about-block {
        display: grid;
        grid-template-columns: minmax(180px, 0.55fr) minmax(0, 1.45fr);
        gap: 80px;
        padding-top: 88px;
        border-top: 1px solid var(--line-strong);
      }

      .about-block h2 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.75rem);
        line-height: 1;
        letter-spacing: -0.07em;
      }

      .about-copy {
        max-width: 700px;
      }

      .about-copy p {
        margin: 0 0 17px;
        color: var(--text-soft);
        font-size: 1.05rem;
      }


      .contact-block {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 45px;
        margin-top: 100px;
        padding-top: 27px;
        border-top: 1px solid var(--line-strong);
      }

      .contact-block h2 {
        max-width: 660px;
        margin: 12px 0 0;
        font-size: clamp(2.25rem, 5vw, 4.5rem);
        line-height: 0.98;
        letter-spacing: -0.08em;
      }

      .contact-copy {
        max-width: 560px;
        margin: 17px 0 0;
        color: var(--text-soft);
      }

      .contact-links {
        display: grid;
        justify-items: end;
        gap: 8px;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.045em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* A: Editorial casebook with a technical profile. */
      .a-page {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
        padding-bottom: 72px;
      }

      .a-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(250px, 0.6fr);
        gap: clamp(50px, 10vw, 145px);
        padding: 88px 0 92px;
        border-bottom: 1px solid var(--line);
      }

      .a-hero h1 {
        max-width: 730px;
        margin: 19px 0 25px;
        font-size: clamp(3.1rem, 6.8vw, 5.5rem);
        line-height: 0.98;
        letter-spacing: -0.085em;
      }

      .a-hero-lede {
        max-width: 680px;
        margin: 0;
        color: var(--text-soft);
        font-size: clamp(1.05rem, 1.8vw, 1.3rem);
        line-height: 1.5;
      }

      .hero-links {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 31px;
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: 650;
      }

      .hero-links a {
        border-bottom: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
      }

      .a-hero-aside {
        align-self: end;
        padding-left: 25px;
        border-left: 1px solid var(--line-strong);
      }


      .a-work {
        padding: 88px 0;
      }

      .a-featured {
        padding-top: 31px;
        border-top: 1px solid var(--line-strong);
      }

      .a-featured-grid {
        display: grid;
        grid-template-columns: 55px minmax(0, 1fr) minmax(225px, 0.4fr);
        gap: 24px;
      }

      .a-featured .project-title {
        font-size: clamp(1.9rem, 4vw, 3.1rem);
      }

      .a-featured .project-proof {
        padding-left: 24px;
        border-left: 1px solid var(--line);
      }

      .a-project-list {
        margin-top: 48px;
        border-top: 1px solid var(--line-strong);
      }

      .a-project {
        padding: 31px 0 35px;
        border-bottom: 1px solid var(--line);
        scroll-margin-top: 25px;
      }

      .a-project > div {
        display: grid;
        grid-template-columns: 55px minmax(0, 1fr) minmax(225px, 0.4fr);
        gap: 24px;
      }

      .a-project .project-proof {
        padding-left: 24px;
        border-left: 1px solid var(--line);
      }


      .a-independent {
        margin-top: 60px;
        padding-top: 24px;
        border-top: 1px solid var(--line-strong);
      }

      .a-independent h2 {
        margin: 0 0 8px;
        font-size: 1rem;
        letter-spacing: -0.02em;
      }

      .a-independent p {
        max-width: 700px;
        margin: 0;
        color: var(--text-soft);
      }

      /* B: Résumé timeline with chronology and ownership. */
      .b-page {
        width: min(1180px, calc(100% - 60px));
        margin: 0 auto;
        padding-bottom: 78px;
      }

      .b-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 35px;
        padding: 48px 0 24px;
        border-bottom: 2px solid var(--text);
      }

      .b-header nav {
        display: flex;
        gap: 20px;
        color: var(--text-soft);
        font-size: 0.84rem;
      }

      .b-header nav a:hover {
        color: var(--accent);
      }

      .b-header-status {
        display: grid;
        justify-items: end;
        gap: 4px;
        color: var(--text-soft);
        font-size: 0.8rem;
        text-align: right;
      }

      .b-intro {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(250px, 0.7fr);
        gap: 80px;
        padding: 72px 0 75px;
        border-bottom: 1px solid var(--line);
      }

      .b-intro h1 {
        max-width: 690px;
        margin: 15px 0 20px;
        font-size: clamp(2.8rem, 5.5vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.085em;
      }

      .b-intro p {
        max-width: 670px;
        margin: 0;
        color: var(--text-soft);
        font-size: 1.05rem;
      }

      .b-profile {
        align-self: end;
      }

      .b-profile h2 {
        margin: 0 0 15px;
        font-family: var(--mono);
        font-size: 0.68rem;
        font-weight: 400;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .b-profile-list {
        display: grid;
        gap: 12px;
        margin: 0;
      }

      .b-profile-list div {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 12px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }

      .b-profile-list dt {
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.6rem;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .b-profile-list dd {
        margin: 0;
        font-size: 0.88rem;
      }

      .b-experience {
        padding-top: 70px;
      }

      .b-section-bar {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 14px;
        border-bottom: 2px solid var(--text);
      }

      .b-section-bar h2,
      .b-independent h2 {
        margin: 0;
        font-size: 1rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .b-section-bar span,
      .b-independent > p {
        margin: 0;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .b-row {
        border-bottom: 1px solid var(--line);
        scroll-margin-top: 25px;
      }

      .b-row > summary {
        display: grid;
        grid-template-columns: 105px 160px minmax(0, 1fr) 75px;
        gap: 22px;
        align-items: start;
        min-height: 115px;
        padding: 25px 0;
        cursor: pointer;
        list-style: none;
      }

      .b-row > summary::-webkit-details-marker {
        display: none;
      }

      .b-row > summary::after {
        display: none;
      }

      .b-date,
      .b-company {
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.65rem;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .b-role strong {
        display: block;
        margin: -4px 0 7px;
        font-size: 1.25rem;
        letter-spacing: -0.045em;
      }

      .b-role small {
        display: block;
        max-width: 480px;
        color: var(--text-soft);
        font-size: 0.9rem;
        line-height: 1.45;
      }

      .b-open-label {
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.61rem;
        letter-spacing: 0.045em;
        text-align: right;
        text-transform: uppercase;
      }

      .b-row[open] .b-open-label::before {
        content: "Close";
      }

      .b-row:not([open]) .b-open-label::before {
        content: "Read";
      }

      .b-row-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 50px;
        padding: 0 0 29px 287px;
      }

      .b-row-body .project-story {
        max-width: 650px;
      }

      .b-row-body .project-proof {
        padding-left: 20px;
        border-left: 1px solid var(--line);
      }

      .b-row-body .case-notes {
        grid-column: 1 / -1;
        margin-top: 0;
      }

      .b-independent {
        margin-top: 60px;
      }

      .b-independent > p {
        margin-top: 8px;
      }

      .b-about {
        padding-top: 75px;
      }

      .b-contact {
        margin-top: 85px;
      }

      /* C: Case index with one calm selected-case column. */
      .c-page {
        width: min(1160px, calc(100% - 56px));
        margin: 0 auto;
        padding-bottom: 80px;
      }

      .c-header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 25px;
        min-height: 78px;
        border-bottom: 1px solid var(--line);
      }

      .c-header nav {
        display: flex;
        gap: 20px;
        color: var(--text-soft);
        font-size: 0.84rem;
      }

      .c-header-status {
        justify-self: end;
        color: var(--accent);
        font-size: 0.8rem;
      }

      .c-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(270px, 0.55fr);
        align-items: end;
        gap: 70px;
        padding: 85px 0 73px;
      }

      .c-hero h1 {
        max-width: 650px;
        margin: 15px 0 0;
        font-size: clamp(3rem, 6vw, 5.7rem);
        line-height: 0.93;
        letter-spacing: -0.09em;
      }

      .c-hero p:last-child {
        max-width: 385px;
        margin: 0;
        color: var(--text-soft);
        font-size: 1rem;
      }

      .c-work {
        display: grid;
        grid-template-columns: minmax(245px, 0.53fr) minmax(0, 1.47fr);
        border-top: 1px solid var(--line-strong);
        border-bottom: 1px solid var(--line-strong);
      }

      .c-index {
        padding: 25px 25px 35px 0;
        border-right: 1px solid var(--line);
      }

      .c-index h2 {
        margin: 0 0 18px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.65rem;
        font-weight: 400;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .c-case-link {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        gap: 7px;
        width: 100%;
        padding: 15px 10px 15px 0;
        border: 0;
        border-top: 1px solid var(--line);
        background: transparent;
        cursor: pointer;
        text-align: left;
      }

      .c-case-link:hover,
      .c-case-link[aria-current="page"] {
        color: var(--accent);
      }

      .c-case-link[aria-current="page"] .c-case-link-title {
        color: var(--text);
      }

      .c-case-link-number {
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.65rem;
      }

      .c-case-link-title {
        display: block;
        color: var(--text);
        font-size: 0.92rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .c-case-link-meta {
        display: block;
        margin-top: 4px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.57rem;
        letter-spacing: 0.035em;
        text-transform: uppercase;
      }

      .c-reading {
        min-width: 0;
        padding: 42px clamp(25px, 5vw, 72px) 55px;
      }

      .c-reading-meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.63rem;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .c-reading h2 {
        max-width: 650px;
        margin: 20px 0 14px;
        font-size: clamp(2.25rem, 5vw, 4.6rem);
        line-height: 0.94;
        letter-spacing: -0.085em;
      }

      .c-reading-summary {
        max-width: 690px;
        margin: 0;
        color: var(--text-soft);
        font-size: 1.08rem;
        line-height: 1.55;
      }

      .c-owned {
        max-width: 690px;
        margin-top: 33px;
        padding-top: 17px;
        border-top: 1px solid var(--line);
      }

      .c-owned-label {
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.64rem;
        font-weight: 700;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .c-owned p {
        margin: 9px 0 0;
        color: var(--text);
        font-size: 1rem;
      }

      .c-proof {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
        max-width: 690px;
        margin-top: 34px;
        padding: 19px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .c-reading .case-notes {
        max-width: 690px;
      }

      .c-about {
        max-width: 810px;
        padding-top: 78px;
      }

      .c-about h2 {
        margin: 0 0 15px;

      }

      @media (prefers-reduced-motion: reduce) {

        </div>

      const tags = (items) => items.map((item) => `<span class="tag">${esc(item)}</span>`).join("");

      const caseNotes = (project, className = "", includeRole = true) => `

                <p>${esc(value)}</p>

            <span class="case-footer-label">Stack</span>

            <section class="c-hero" aria-labelledby="c-title"><div><p class="eyebrow">Project index</p><h1 id="c-title">What I owned, what changed.</h1></div><p>Choose a case on the left. The selected project stays in one reading column, with evidence first and deeper notes when you want them.</p></section>
            <section class="c-work" id="work" aria-label="Case index"><nav class="c-index" aria-label="Selected cases"><h2>Selected cases</h2>${projects.map(renderCLink).join("")}</nav><article class="c-reading" id="case-reading" aria-live="polite"></article></section>
            <section class="c-about" id="about" aria-labelledby="c-about-title"><h2 id="c-about-title">How I work.</h2><p>Since 2015, I have worked on backend and platform systems for HR, mobility, fashion, and enterprise CMS products.</p></section>
            ${contact("contact-block c-contact")}
          </main>
        </div>
      `;

      const aliases = { D: "B", E: "C" };
      const normalizeVariant = (key) => {
        const normalized = aliases[String(key).toUpperCase()] || String(key).toUpperCase();
        return variants.some((variant) => variant.key === normalized) ? normalized : "A";
      };
      const readVariant = () => new URLSearchParams(location.search).get("variant") || "A";

      const syncVariantUrl = (key) => {
        const url = new URL(location.href);
        url.searchParams.set("variant", key);
        url.hash = "";
        history.replaceState({}, "", url);
      };

      const selectCase = (id, updateHash = true) => {
        const project = projects.find((candidate) => candidate.id === id) || projects[0];
        const reading = document.querySelector("#case-reading");
        if (!reading) return;
        reading.innerHTML = renderCCase(project);
        document.querySelectorAll("[data-case-id]").forEach((button) => {
          button.setAttribute("aria-current", button.dataset.caseId === project.id ? "page" : "false");
        });
        if (updateHash) {
          const url = new URL(location.href);
          url.hash = project.id;
          history.replaceState({}, "", url);
        }
      };

      const bindCaseIndex = () => {
        document.querySelectorAll("[data-case-id]").forEach((button) => {
          button.addEventListener("click", () => selectCase(button.dataset.caseId));
        });
        selectCase(location.hash.slice(1), false);
      };

      const render = (key) => {
        const normalized = normalizeVariant(key);
        app.innerHTML = normalized === "A" ? renderVariantA() : normalized === "B" ? renderVariantB() : renderVariantC();
        const current = variants.find((variant) => variant.key === normalized);
        variantLabel.innerHTML = `<strong>${current.key}</strong> · ${current.name}`;
        document.title = `Alexey Zarakovskiy: ${current.name} prototype`;
        if (normalized === "C") bindCaseIndex();
        return normalized;
      };

      const setVariant = (key, updateUrl = true) => {
        const normalized = render(key);
        if (updateUrl) syncVariantUrl(normalized);
        window.scrollTo({ top: 0, behavior: "instant" });
      };

      const cycle = (direction) => {
        const currentIndex = variants.findIndex((variant) => variant.key === normalizeVariant(readVariant()));
        const nextIndex = (currentIndex + direction + variants.length) % variants.length;
        setVariant(variants[nextIndex].key);
      };

      document.querySelector("#previous-variant").addEventListener("click", () => cycle(-1));
      document.querySelector("#next-variant").addEventListener("click", () => cycle(1));
      document.addEventListener("keydown", (event) => {
        if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });
      window.addEventListener("popstate", () => render(normalizeVariant(readVariant())));
      window.addEventListener("hashchange", () => {
        if (normalizeVariant(readVariant()) === "C") selectCase(location.hash.slice(1), false);
      });

      switcher.hidden = !location.pathname.includes("/prototype/");
      const initialVariant = normalizeVariant(readVariant());
      if (readVariant().toUpperCase() !== initialVariant) syncVariantUrl(initialVariant);
      render(initialVariant);
    </script>
  </body>
</html>
