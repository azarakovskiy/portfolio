<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Throwaway portfolio UI prototype for Alexey Zarakovskiy."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Alexey Zarakovskiy — Portfolio prototype</title>
    <style>
      /*
       * THROWAWAY PROTOTYPE
       * Three developer-first portfolio variants, switchable via ?variant=,
       * on /prototype/portfolio/. A/C were intentionally removed after review.
       * Keep the factual project content; rewrite the chosen presentation.
       */
      :root {
        color-scheme: dark light;
        --bg: #141b18;
        --surface: #1c2621;
        --surface-raised: #243129;
        --surface-inset: #0e1512;
        --text: #edf4ee;
        --text-soft: #b2c0b6;
        --text-faint: #7d8d83;
        --line: #35463c;
        --line-strong: #51655a;
        --accent: #a8db73;
        --accent-strong: #5ab77e;
        --accent-soft: #d7edbe;
        --yellow: #f4bd68;
        --blue: #8bc7ed;
        --purple: #d09af2;
        --red: #f09586;
        --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eff2ea;
          --surface: #fcfdf8;
          --surface-raised: #f1f5ec;
          --surface-inset: #e4ebe0;
          --text: #17211b;
          --text-soft: #56645a;
          --text-faint: #77847b;
          --line: #cbd7cc;
          --line-strong: #a6b8aa;
          --accent: #367c4b;
          --accent-strong: #1e8b5d;
          --accent-soft: #dff0cf;
          --yellow: #b87400;
          --blue: #2673a2;
          --purple: #7b4ba0;
          --red: #b85140;
          --shadow: 0 24px 60px rgba(36, 63, 43, 0.12);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        line-height: 1.5;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      summary {
        font: inherit;
      }

      button {
        color: inherit;
      }

      ::selection {
        background: var(--accent);
        color: var(--surface-inset);
      }

      a:focus-visible,
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--yellow);
        outline-offset: 3px;
      }

      .site {
        min-height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }

      .mono,
      .eyebrow,
      .label,
      .meta,
      .tag,
      .metric-label,
      .theme-chip,
      .file-name,
      .project-number,
      .panel-title,
      .status,
      .crumb,
      .code-label {
        font-family: var(--mono);
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 0.66rem;
        font-weight: 700;
      }

      .muted {
        color: var(--text-soft);
      }

      .theme-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--text-faint);
        font-size: 0.59rem;
        white-space: nowrap;
      }

      .theme-chip::before {
        content: "◐";
        color: var(--accent);
        font-size: 0.77rem;
      }

      @media (prefers-color-scheme: light) {
        .theme-chip::before {
          content: "○";
        }
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.83rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .brand-mark {
        display: grid;
        width: 29px;
        height: 29px;
        place-items: center;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: var(--surface-inset);
        font-family: var(--mono);
        font-size: 0.64rem;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 64px;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .topbar-right,
      .topbar-links {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .topbar-links {
        color: var(--text-soft);
        font-family: var(--mono);
        font-size: 0.63rem;
        text-transform: uppercase;
      }

      .topbar-links a:hover,
      .text-link:hover {
        color: var(--accent);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 25px;
        padding: 3px 8px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        color: var(--text-soft);
        font-family: var(--mono);
        font-size: 0.59rem;
        white-space: nowrap;
      }

      .pill--accent {
        border-color: color-mix(in srgb, var(--accent) 55%, transparent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: var(--accent);
      }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 3px 7px;
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--text-soft);
        font-size: 0.56rem;
        white-space: nowrap;
      }

      .tag--accent {
        border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
        color: var(--accent);
      }

      .metric-list {
        display: flex;
        flex-wrap: wrap;
        gap: 17px;
      }

      .metric {
        min-width: 82px;
      }

      .metric-value {
        display: block;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -0.06em;
      }

      .metric-label {
        display: block;
        margin-top: 1px;
        color: var(--text-faint);
        font-size: 0.52rem;
      }

      .project-number {
        color: var(--accent);
        font-size: 0.59rem;
      }

      .panel-title {
        color: var(--text-faint);
        font-size: 0.59rem;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--accent);
        font-size: 0.57rem;
      }

      .status::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-strong);
        content: "";
      }

      .pipeline {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
        gap: 8px;
      }

      .pipeline-node {
        min-height: 65px;
        padding: 11px;
        border: 1px solid var(--line-strong);
        background: var(--surface-inset);
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.57rem;
      }

      .pipeline-node strong {
        display: block;
        margin-top: 4px;
        color: var(--text);
        font-family: var(--sans);
        font-size: 0.73rem;
        font-weight: 600;
      }

      .pipeline-arrow {
        display: none;
      }

      .case-summary {
        margin: 0;
        color: var(--text-soft);
        font-size: 0.95rem;
        line-height: 1.55;
      }

      .case-details {
        margin-top: 22px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .case-details > summary,
      .project-row > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 46px;
        cursor: pointer;
        list-style: none;
        color: var(--text-soft);
        font-family: var(--mono);
        font-size: 0.63rem;
        text-transform: uppercase;
      }

      .case-details > summary::-webkit-details-marker,
      .project-row > summary::-webkit-details-marker {
        display: none;
      }

      .case-details > summary::after,
      .project-row > summary::after {
        color: var(--accent);
        content: "+";
        font-size: 1rem;
      }

      .case-details[open] > summary::after,
      .project-row[open] > summary::after {
        content: "−";
      }

      .details-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 30px;
        padding: 5px 0 25px;
      }

      .detail-block {
        margin: 0;
      }

      .detail-label {
        display: block;
        margin-bottom: 5px;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.57rem;
        text-transform: uppercase;
      }

      .detail-block p {
        margin: 0;
        color: var(--text-soft);
        font-size: 0.84rem;
        line-height: 1.55;
      }

      /* B — existing workbench, now description-first and expandable. */
      .b-page {
        min-height: 100vh;
      }

      .b-layout {
        display: grid;
        grid-template-columns: 238px minmax(0, 1fr);
        min-height: calc(100vh - 64px);
      }

      .b-sidebar {
        position: sticky;
        top: 0;
        align-self: start;
        height: calc(100vh - 64px);
        padding: 27px 20px;
        border-right: 1px solid var(--line);
        background: var(--surface);
      }

      .sidebar-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 15px;
      }

      .sidebar-heading .panel-title {
        color: var(--accent);
      }

      .b-project-list {
        display: grid;
        gap: 2px;
      }

      .b-project-link {
        display: grid;
        grid-template-columns: 29px minmax(0, 1fr);
        gap: 4px;
        padding: 9px 7px;
        border-left: 2px solid transparent;
        color: var(--text-soft);
        font-size: 0.72rem;
      }

      .b-project-link:hover {
        border-left-color: var(--accent);
        background: var(--surface-raised);
        color: var(--text);
      }

      .b-project-link small {
        display: block;
        grid-column: 2;
        margin-top: -3px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.54rem;
        text-transform: uppercase;
      }

      .sidebar-footer {
        position: absolute;
        right: 20px;
        bottom: 25px;
        left: 20px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--text-faint);
        font-size: 0.68rem;
      }

      .sidebar-footer strong {
        display: block;
        margin-bottom: 3px;
        color: var(--text);
        font-size: 0.77rem;
      }

      .b-main {
        width: min(1130px, calc(100% - 100px));
        margin: 0 auto;
        padding: 55px 0 145px;
      }

      .b-heading {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(230px, 0.45fr);
        gap: 60px;
        align-items: end;
        padding-bottom: 45px;
        border-bottom: 1px solid var(--line);
      }

      .b-heading h1 {
        max-width: 690px;
        margin: 13px 0 0;
        font-size: clamp(3rem, 7vw, 6.4rem);
        line-height: 0.9;
        letter-spacing: -0.09em;
      }

      .b-heading p {
        margin: 0;
        color: var(--text-soft);
        font-size: 0.92rem;
      }

      .b-case {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(220px, 0.65fr);
        margin-top: 48px;
        border: 1px solid var(--line-strong);
        background: var(--surface);
      }

      .b-case-main {
        padding: clamp(25px, 4vw, 48px);
      }

      .b-case-meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.61rem;
        text-transform: uppercase;
      }

      .b-case h2 {
        max-width: 580px;
        margin: 22px 0 16px;
        font-size: clamp(2.3rem, 5vw, 5rem);
        line-height: 0.9;
        letter-spacing: -0.09em;
      }

      .b-case-main .pipeline {
        margin-top: 30px;
      }

      .b-inspector {
        display: flex;
        flex-direction: column;
        gap: 25px;
        padding: 25px;
        border-left: 1px solid var(--line);
        background: var(--surface-inset);
      }

      .inspector-block {
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }

      .inspector-block:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .inspector-block h3 {
        margin: 0 0 12px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.59rem;
        font-weight: 400;
        text-transform: uppercase;
      }

      .inspector-block p {
        margin: 0;
        color: var(--text-soft);
        font-size: 0.79rem;
      }

      .b-index {
        margin-top: 58px;
        border-top: 1px solid var(--line);
      }

      .project-row {
        border-bottom: 1px solid var(--line);
      }

      .project-row > summary {
        min-height: 72px;
        padding: 0 3px;
      }

      .project-row > summary > span:nth-child(2) {
        flex: 1;
        color: var(--text);
        font-family: var(--sans);
        font-size: 1rem;
        font-weight: 650;
        letter-spacing: -0.03em;
        text-transform: none;
      }

      .project-row > summary > span:nth-child(3) {
        max-width: 330px;
        color: var(--text-soft);
        font-family: var(--sans);
        font-size: 0.77rem;
        letter-spacing: 0;
        text-align: right;
        text-transform: none;
      }

      .project-row-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(190px, 0.45fr);
        gap: 30px;
        padding: 0 3px 26px 58px;
      }

      .project-row-content p {
        margin: 0 0 16px;
        color: var(--text-soft);
        font-size: 0.84rem;
      }

      .b-about {
        display: grid;
        grid-template-columns: 0.7fr 1.3fr;
        gap: 65px;
        margin-top: 90px;
        padding-top: 26px;
        border-top: 1px solid var(--line);
      }

      .b-about h2 {
        margin: 0;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.66rem;
        font-weight: 400;
        text-transform: uppercase;
      }

      .b-about p {
        max-width: 650px;
        margin: 0 0 14px;
        color: var(--text-soft);
        font-size: 1rem;
      }

      .b-contact {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 30px;
        margin-top: 85px;
        padding-top: 25px;
        border-top: 1px solid var(--line);
      }

      .b-contact h2 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 4.2rem);
        line-height: 0.92;
        letter-spacing: -0.08em;
      }

      .contact-links {
        display: grid;
        gap: 7px;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 0.65rem;
        text-align: right;
        text-transform: uppercase;
      }

      /* D — PostHog-inspired desktop: playful shell, serious project workspace. */
      .d-page {
        min-height: 100vh;
        background:
          radial-gradient(circle at 8% 22%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 24%),
          radial-gradient(circle at 92% 76%, color-mix(in srgb, var(--yellow) 13%, transparent), transparent 22%),
          var(--bg);
      }

      .d-global {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 58px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        backdrop-filter: blur(12px);
      }

      .d-global-nav {
        display: flex;
        align-items: center;
        gap: 18px;
        color: var(--text-soft);
        font-family: var(--mono);
        font-size: 0.59rem;
        text-transform: uppercase;
      }

      .d-global-nav a:hover {
        color: var(--accent);
      }

      .d-stage {
        width: min(1280px, calc(100% - 56px));
        margin: 0 auto;
        padding: 57px 0 145px;
      }

      .d-intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 45px;
        margin-bottom: 33px;
      }

      .d-intro h1 {
        max-width: 670px;
        margin: 12px 0 0;
        font-size: clamp(2.7rem, 6vw, 5.7rem);
        line-height: 0.9;
        letter-spacing: -0.09em;
      }

      .d-intro p {
        max-width: 315px;
        margin: 0;
        color: var(--text-soft);
        font-size: 0.87rem;
      }

      .d-window {
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .window-chrome {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 43px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background: var(--surface-raised);
      }

      .window-controls {
        display: flex;
        gap: 6px;
      }

      .window-controls i {
        display: block;
        width: 9px;
        height: 9px;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        background: var(--surface-inset);
      }

      .window-title {
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.59rem;
      }

      .window-chrome .theme-chip {
        font-size: 0.53rem;
      }

      .d-layout {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr) 245px;
        min-height: 660px;
      }

      .d-rail,
      .d-inspector {
        background: var(--surface-inset);
      }

      .d-rail {
        padding: 22px 15px;
        border-right: 1px solid var(--line);
      }

      .d-rail h2 {
        margin: 0 0 12px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.58rem;
        font-weight: 400;
        text-transform: uppercase;
      }

      .d-file {
        display: grid;
        grid-template-columns: 25px 1fr;
        gap: 4px;
        align-items: start;
        padding: 8px 7px;
        border-left: 2px solid transparent;
        color: var(--text-soft);
        font-size: 0.68rem;
      }

      .d-file:hover,
      .d-file[aria-current="page"] {
        border-left-color: var(--accent);
        background: var(--surface-raised);
        color: var(--text);
      }

      .d-file small {
        display: block;
        grid-column: 2;
        margin-top: -4px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.51rem;
        text-transform: uppercase;
      }

      .d-main {
        padding: 35px clamp(25px, 4vw, 55px);
      }

      .d-main-meta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.57rem;
        text-transform: uppercase;
      }

      .d-main h2 {
        max-width: 560px;
        margin: 18px 0 12px;
        font-size: clamp(2rem, 4.4vw, 4.2rem);
        line-height: 0.92;
        letter-spacing: -0.085em;
      }

      .d-main .case-summary {
        max-width: 650px;
      }

      .d-main .pipeline {
        margin: 28px 0 8px;
      }

      .d-inspector {
        padding: 22px 18px;
        border-left: 1px solid var(--line);
      }

      .d-inspector-section {
        padding: 0 0 22px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }

      .d-inspector-section:last-child {
        margin-bottom: 0;
        border-bottom: 0;
      }

      .d-inspector-section h3 {
        margin: 0 0 12px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.58rem;
        font-weight: 400;
        text-transform: uppercase;
      }

      .d-inspector-section p {
        margin: 0;
        color: var(--text-soft);
        font-size: 0.75rem;
      }

      .d-project-drawer {
        padding: 28px 19px 0;
        border-top: 1px solid var(--line);
        background: var(--surface-raised);
      }

      .d-project-drawer > h2 {
        margin: 0 0 17px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 0.59rem;
        font-weight: 400;
        text-transform: uppercase;
      }

      .d-drawer-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .d-drawer-grid .project-row {
        border: 1px solid var(--line);
        background: var(--surface);
      }

      .d-drawer-grid .project-row > summary {
        display: grid;
        grid-template-columns: 31px 1fr;
        align-content: center;
        min-height: 93px;
        padding: 13px;
      }

      .d-drawer-grid .project-row > summary > span:nth-child(2) {
        color: var(--text);
        font-size: 0.79rem;
        font-weight: 650;
        letter-spacing: -0.02em;
        text-transform: none;
      }

      .d-drawer-grid .project-row > summary > span:nth-child(3) {
        grid-column: 2;

          stack: ["OpenAI API", "MCP", "Claude Code", "Developer tooling"],
          diagram: ["Question", "Experiment", "Useful workflow"],
          personal: true,
        },
      ];

      const variants = [
        { key: "B", name: "Workbench / case files" },
        { key: "D", name: "Project desktop / PostHog-inspired" },
        { key: "E", name: "Repository / code review" },
      ];

      const app = document.querySelector("#app");
      const switcher = document.querySelector("#prototype-switcher");
      const label = document.querySelector("#variant-label");

      const esc = (value) => String(value).replace(/[&<>\"]/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
      })[character]);

      const tags = (items, className = "") => items.map((item) => `<span class="tag ${className}">${esc(item)}</span>`).join("");

      const metrics = (items) => items.map(([value, text]) => `
        <div class="metric">
          <strong class="metric-value">${esc(value)}</strong>
          <span class="metric-label">${esc(text)}</span>
        </div>
      `).join("");

      const pipeline = (items) => `
        <div class="pipeline" aria-label="System flow">
          ${items.map((item, index) => `
            <div class="pipeline-node">
              ${index === 0 ? "constraint" : index === items.length - 1 ? "result" : "system"}
              <strong>${esc(item)}</strong>
            </div>
            ${index < items.length - 1 ? `<span class="pipeline-arrow" aria-hidden="true">→</span>` : ""}
          `).join("")}
        </div>
      `;

      const details = (project, className = "case-details", open = false) => `
        <details class="${className}"${open ? " open" : ""}>
          <summary><span>Read the project notes</span><span>${open ? "expanded" : "expand"}</span></summary>
          <div class="details-grid">
            ${Object.entries(project.details).map(([key, value]) => `
              <div class="detail-block">
                <span class="detail-label">${esc(key)}</span>
                <p>${esc(value)}</p>
              </div>
            `).join("")}
          </div>
        </details>
      `;

      const projectRow = (project, className = "project-row") => `
        <details class="${className}" id="${esc(project.id)}">
          <summary>
            <span class="project-number">${esc(project.number)}</span>
            <span>${esc(project.title)}</span>
            <span>${esc(project.client)} · ${esc(project.kind)}</span>
          </summary>
          <div class="project-row-content">
            <div>
              <p>${esc(project.story)}</p>
              ${details(project)}
            </div>
            <div>
              <div class="metric-list">${metrics(project.proof)}</div>
              <div class="tag-list">${tags(project.stack)}</div>
            </div>
          </div>
        </details>
      `;

      const inspector = (project, className = "inspector-block") => `
        <div class="${className}">
          <h3>Project</h3>
          <p><strong>${esc(project.client)}</strong><br />${esc(project.kind)} · ${esc(project.period)}</p>
        </div>
        <div class="${className}">
          <h3>Evidence</h3>
          <div class="metric-list">${metrics(project.proof)}</div>
        </div>
        <div class="${className}">
          <h3>Stack</h3>
          <div class="tag-list">${tags(project.stack, "tag--accent")}</div>
        </div>
      `;

      const renderVariantB = () => {
        const featured = projects[0];
        return `
          <div class="site b-page">
            <header class="topbar">
              <a class="brand" href="#top" aria-label="Alexey Zarakovskiy home"><span class="brand-mark">AZ</span><span>Alexey Zarakovskiy</span></a>
              <nav class="topbar-links" aria-label="Primary navigation"><a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
              <div class="topbar-right"><span class="theme-chip">theme: system</span><span class="pill pill--accent">available for focused work</span></div>
            </header>
            <div class="b-layout" id="top">
              <aside class="b-sidebar">
                <div class="sidebar-heading"><span class="panel-title">/ project files</span><span class="mono muted">${projects.length}</span></div>
                <nav class="b-project-list" aria-label="Project files">
                  ${projects.map((project) => `<a class="b-project-link" href="#${esc(project.id)}"><span class="project-number">${esc(project.number)}</span><span>${esc(project.title)}</span><small>${esc(project.client)}</small></a>`).join("")}
                </nav>
                <div class="sidebar-footer"><strong>Senior backend engineer</strong>Full-stack · language agnostic<br />Amsterdam / remote</div>
              </aside>
              <main class="b-main">
                <section class="b-heading">
                  <div><div class="eyebrow">/ portfolio / technical case files</div><h1>Selected work, with the missing context included.</h1></div>
                  <p>Longer descriptions of the problem, my role, the decisions, and the result. Open a project row when you want more than a headline.</p>
                </section>
                <section class="b-case" id="work">
                  <div class="b-case-main">
                    <div class="b-case-meta"><span>${esc(featured.client)} / ${esc(featured.kind)}</span><span>${esc(featured.period)}</span></div>
                    <h2>${esc(featured.title)}</h2>
                    <p class="case-summary">${esc(featured.summary)}</p>
                    ${pipeline(featured.diagram)}
                    ${details(featured, "case-details", true)}
                  </div>
                  <aside class="b-inspector">${inspector(featured)}</aside>
                </section>
                <section class="b-index" aria-label="All project files">
                  <div class="sidebar-heading"><span class="panel-title">/ all projects</span><span class="status">details available</span></div>
                  ${projects.slice(1).map((project) => projectRow(project)).join("")}
                </section>
                <section class="b-about" id="about">
                  <h2>/ about the engineer</h2>
                  <div><p>I work where product constraints, distributed systems, and a real user outcome meet. Across HR, mobility, fashion, and enterprise CMS platforms, I have moved systems from idea to reliable service and helped teams keep them understandable.</p><p>Now starting a contractor / ZZP chapter: available for backend, platform, or full-stack work where ownership and clarity matter more than a fashionable stack.</p></div>
                </section>
                <footer class="b-contact" id="contact"><h2>Have a system worth making clearer?</h2><div class="contact-links"><a href="mailto:work@azarakovskiy.com">work@azarakovskiy.com ↗</a><a href="https://linkedin.com/in/azarakovskiy">LinkedIn ↗</a><a href="https://github.com/azarakovskiy">GitHub ↗</a></div></footer>
              </main>
            </div>
          </div>
        `;
      };

      const renderDProject = (project) => `
        <details class="project-row" id="${esc(project.id)}">
          <summary><span class="project-number">${esc(project.number)}</span><span>${esc(project.title)}</span><span>${esc(project.client)} · ${esc(project.period)}</span></summary>
          <div class="project-row-content"><p>${esc(project.story)}</p>${details(project)}<div class="tag-list">${tags(project.stack)}</div></div>
        </details>
      `;

      const renderVariantD = () => {
        const featured = projects[0];
        return `
          <div class="site d-page">
            <header class="d-global"><a class="brand" href="#top" aria-label="Alexey Zarakovskiy home"><span class="brand-mark">AZ</span><span>Alexey Zarakovskiy</span></a><nav class="d-global-nav" aria-label="Primary navigation"><a href="#work">Projects</a><a href="#about">About</a><a href="#contact">Contact</a></nav><div class="topbar-right"><span class="theme-chip">theme: system</span><span class="pill pill--accent">open to contractor work</span></div></header>
            <main class="d-stage" id="top">
              <section class="d-intro"><div><div class="eyebrow">/ project desktop / archive</div><h1>Work you can inspect, not just skim.</h1></div><p>PostHog-inspired chrome and workspace navigation, but the content stays practical: what was hard, what I owned, and what changed.</p></section>
              <section class="d-window" id="work">
                <div class="window-chrome"><div class="window-controls" aria-hidden="true"><i></i><i></i><i></i></div><span class="window-title">projects / anonymous-by-design.md</span><span class="theme-chip">system palette</span></div>
                <div class="d-layout">
                  <aside class="d-rail"><h2>Project archive</h2>${projects.map((project, index) => `<a class="d-file" href="#${esc(project.id)}"${index === 0 ? ' aria-current="page"' : ""}><span class="project-number">${esc(project.number)}</span><span>${esc(project.title)}</span><small>${esc(project.client)}</small></a>`).join("")}</aside>
                  <article class="d-main">
                    <div class="d-main-meta"><span>${esc(featured.client)} / ${esc(featured.kind)}</span><span>${esc(featured.period)}</span></div>
                    <h2>${esc(featured.title)}</h2>
                    <p class="case-summary">${esc(featured.story)}</p>
                    ${pipeline(featured.diagram)}
                    ${details(featured, "case-details", true)}
                  </article>
                  <aside class="d-inspector">${inspector(featured, "d-inspector-section")}</aside>
                </div>
                <section class="d-project-drawer"><h2>More project files · open any for the longer note</h2><div class="d-drawer-grid">${projects.slice(1).map(renderDProject).join("")}</div></section>
              </section>
              <section class="d-footer" id="about"><h2>Backend depth.<br />Full-stack range.</h2><div><p class="case-summary">Golang · Java · Kotlin · TypeScript · React · AWS · GCP · Kubernetes · PostgreSQL · Kafka</p><p class="mono muted">Amsterdam / remote · <a class="text-link" href="mailto:work@azarakovskiy.com">work@azarakovskiy.com ↗</a></p></div></section>
              <footer class="d-footer" id="contact"><h2>Send the constraint.</h2><div class="contact-links"><a href="mailto:work@azarakovskiy.com">work@azarakovskiy.com ↗</a><a href="https://linkedin.com/in/azarakovskiy">LinkedIn ↗</a><a href="https://github.com/azarakovskiy">GitHub ↗</a></div></footer>
            </main>
          </div>
        `;
      };

      const renderEProject = (project) => `
        <a class="tree-file" href="#${esc(project.id)}"${project.number === "01" ? ' aria-current="page"' : ""}><span>${project.number === "07" ? "◇" : "▱"}</span><span>${esc(project.id)}.md</span></a>
      `;

      const renderVariantE = () => {
        const featured = projects[0];
        return `
          <div class="site e-page">
            <header class="topbar"><a class="brand" href="#top" aria-label="Alexey Zarakovskiy home"><span class="brand-mark">AZ</span><span>Alexey Zarakovskiy</span></a><div class="topbar-right"><span class="theme-chip">theme: system</span><span class="pill">portfolio / read-only</span></div></header>
            <nav class="e-tabs" aria-label="Open project files"><a class="e-tab" href="#about">about.md</a><a class="e-tab" href="#${esc(featured.id)}" aria-current="page">${esc(featured.id)}.md</a><a class="e-tab" href="#contact">contact.md</a></nav>
            <div class="e-layout" id="top">
              <aside class="e-tree"><div class="tree-heading"><span>portfolio</span><span>⌄</span></div><div class="tree-folder">/projects</div><div class="tree-files">${projects.map(renderEProject).join("")}</div><div class="tree-folder">/profile</div><div class="tree-files"><a class="tree-file" href="#about"><span>▱</span><span>about.md</span></a><a class="tree-file" href="#contact"><span>▱</span><span>contact.md</span></a></div></aside>
              <main class="e-editor">
                <div class="editor-crumb"><span>projects</span><span>/</span><strong>${esc(featured.id)}.md</strong></div>
                <h1>${esc(featured.title)}</h1>
                <p class="editor-lede">${esc(featured.summary)} ${esc(featured.story)}</p>
                <div class="code-file" id="${esc(featured.id)}">
                  <div class="code-gutter"><span>01</span><span>05</span><span>09</span><span>13</span><span>17</span></div>
                  <div class="code-body">
                    <details class="code-section" open><summary><span class="code-label">problem:</span> what needed to change</summary><p>${esc(featured.details.problem)}</p></details>
                    <details class="code-section" open><summary><span class="code-label">role:</span> what I owned</summary><p>${esc(featured.details.role)}</p></details>
                    <details class="code-section"><summary><span class="code-label">decisions:</span> how the system moved</summary><p>${esc(featured.details.work)}</p><div class="editor-result">${featured.diagram.map((item) => `<span>${esc(item)}</span>`).join("<strong>→</strong>")}</div></details>
                    <details class="code-section" open><summary><span class="code-label">result:</span> what changed</summary><p>${esc(featured.details.result)}</p><div class="editor-result">${featured.proof.map(([value, text]) => `<span>${esc(text)}<strong>${esc(value)}</strong></span>`).join("")}</div></details>
                  </div>
                </div>
                <section class="e-about" id="about"><div class="code-gutter"><span>ABOUT</span></div><p>I work across backend, platform, and full-stack boundaries. The useful part is not the language choice; it is making the tradeoff, migration, and operating model explicit enough for a team to own.</p></section>
                <footer class="e-footer" id="contact"><h2>Open to the right constraint.</h2><div class="e-footer-links"><a href="mailto:work@azarakovskiy.com">work@azarakovskiy.com ↗</a><a href="https://linkedin.com/in/azarakovskiy">LinkedIn ↗</a><a href="https://github.com/azarakovskiy">GitHub ↗</a></div></footer>
              </main>
              <aside class="e-inspector"><h2>inspector</h2>${inspector(featured, "e-inspector-section")}</aside>
            </div>
          </div>
        `;
      };

      const normalizeVariant = (key) => variants.some((variant) => variant.key === key) ? key : "B";
      const readVariant = () => (new URLSearchParams(location.search).get("variant") || "B").toUpperCase();

      const syncVariantUrl = (key) => {
        const url = new URL(location.href);
        url.searchParams.set("variant", key);
        history.replaceState({}, "", url);
      };

      const render = (key) => {
        const normalized = normalizeVariant(key);
        app.innerHTML = normalized === "B" ? renderVariantB() : normalized === "D" ? renderVariantD() : renderVariantE();
        const current = variants.find((variant) => variant.key === normalized);
        label.innerHTML = `<span>${current.key}</span> · ${current.name}`;
        document.title = `Alexey Zarakovskiy — ${current.name}`;
        return normalized;
      };

      const setVariant = (key, updateUrl = true) => {
        const normalized = render(key);
        if (updateUrl) syncVariantUrl(normalized);
        window.scrollTo({ top: 0, behavior: "instant" });
      };

      const cycle = (direction) => {
        const currentIndex = variants.findIndex((variant) => variant.key === normalizeVariant(readVariant()));
        const nextIndex = (currentIndex + direction + variants.length) % variants.length;
        setVariant(variants[nextIndex].key);
      };

      document.querySelector("#previous-variant").addEventListener("click", () => cycle(-1));
      document.querySelector("#next-variant").addEventListener("click", () => cycle(1));
      document.addEventListener("keydown", (event) => {
        if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });
      window.addEventListener("popstate", () => {
        const normalized = normalizeVariant(readVariant());
        if (readVariant() !== normalized) syncVariantUrl(normalized);
        render(normalized);
      });

      switcher.hidden = !location.pathname.includes("/prototype/");
      const initialVariant = normalizeVariant(readVariant());
      if (readVariant() !== initialVariant) syncVariantUrl(initialVariant);
      render(initialVariant);
    </script>
  </body>
</html>
