<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Freelance software developer portfolio for Alexey Zarakovskiy, covering backend, platform, full-stack, and production engineering work."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Alexey Zarakovskiy — Senior software engineer</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap");

      /*
       * THROWAWAY UI PROTOTYPE
       * Question: can one chronological disclosure list show enough project
       * context before each case is opened?
       * One chosen direction, polished in place.
       */
      :root {
        color-scheme: light dark;
        --paper: #f2f2ef;
        --ink: #181b1a;
        --graphite: #59605c;
        --rule: #c9ceca;
        --signal: #1557ff;
        --signal-wash: #e4eaff;
        --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        --display: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #101312;
          --ink: #f4f5f2;
          --graphite: #a9b0ac;
          --rule: #3a403d;
          --signal: #7ea1ff;
          --signal-wash: #18264c;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--body);
        font-size: 16px;
        line-height: 1.55;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        color: var(--signal);
      }

      button,
      summary {
        font: inherit;
      }

      ::selection {
        background: var(--signal);
        color: var(--paper);
      }

      a:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--signal);
        outline-offset: 5px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .site-shell {
        width: min(1220px, calc(100% - 64px));
        margin: 0 auto;
      }

      .site-header {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
        align-items: center;
        gap: 32px;
        min-height: 88px;
        border-bottom: 1px solid var(--rule);
      }

      .brand {
        display: flex;
        flex-direction: column;
        width: fit-content;
        line-height: 1.25;
      }

      .brand-name {
        font-family: var(--display);
        font-size: 1.06rem;
        font-weight: 700;
      }

      .brand-role {
        color: var(--graphite);
        font-size: 0.78rem;
      }

      .primary-nav {
        display: flex;
        gap: 26px;
        color: var(--graphite);
        font-size: 0.86rem;
      }

      .primary-nav a {
        padding: 8px 0;
      }

      .availability {
        display: inline-flex;
        align-items: center;
        justify-self: end;
        gap: 9px;
        color: var(--ink);
        font-size: 0.82rem;
        font-weight: 500;
      }

      .availability::before {
        width: 9px;
        height: 9px;
        background: var(--signal);
        content: "";
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(290px, 0.65fr);
        align-items: end;
        gap: clamp(50px, 8vw, 120px);
        padding: clamp(72px, 9vw, 125px) 0 clamp(80px, 10vw, 140px);
      }

      .hero h1 {
        max-width: 820px;
        margin: 0;
        font-family: var(--display);
        font-size: clamp(4rem, 7.6vw, 7rem);
        font-weight: 600;
        letter-spacing: -0.055em;
        line-height: 0.88;
      }

      .hero-lede {
        max-width: 62ch;
        margin: 32px 0 0;
        color: var(--graphite);
        font-size: clamp(1.08rem, 1.5vw, 1.3rem);
        line-height: 1.5;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 13px 24px;
        margin-top: 34px;
      }

      .primary-link {
        padding: 12px 17px 13px;
        background: var(--signal);
        color: #fff;
        font-weight: 600;
      }

      .primary-link:hover {
        background: var(--ink);
        color: var(--paper);
      }

      .text-link {
        border-bottom: 1px solid currentColor;
        color: var(--signal);
        font-weight: 500;
      }

      .capabilities {
        margin: 0;
        border-top: 2px solid var(--ink);
      }

      .capabilities div {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 16px;
        padding: 16px 0 17px;
        border-bottom: 1px solid var(--rule);
      }

      .capabilities dt,
      .capabilities dd {
        margin: 0;
      }

      .capabilities dt {
        color: var(--graphite);
        font-size: 0.78rem;
      }

      .capabilities dd {
        font-family: var(--display);
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.35;
      }

      .work {
        scroll-margin-top: 30px;
      }

      .section-intro {
        display: grid;
        grid-template-columns: minmax(240px, 0.8fr) minmax(320px, 1.2fr);
        align-items: end;
        gap: 60px;
        padding: 45px 0 47px;
        border-top: 1px solid var(--rule);
      }

      .section-intro h2 {
        margin: 0;
        font-family: var(--display);
        font-size: clamp(2.8rem, 5vw, 4.7rem);
        font-weight: 600;
        letter-spacing: -0.045em;
        line-height: 0.95;
      }

      .section-intro p {
        max-width: 60ch;
        margin: 0;
        color: var(--graphite);
        font-size: 1.02rem;
      }

      .timeline {
        border-top: 2px solid var(--ink);
      }

      .timeline-head,
      .project-summary {
        display: grid;
        grid-template-columns:
          105px minmax(180px, 0.8fr) minmax(310px, 1.35fr)
          minmax(150px, 0.65fr) 34px;
        gap: 24px;
      }

      .timeline-head {
        padding: 12px 0;
        color: var(--graphite);
        font-size: 0.76rem;
      }

      .timeline-head span:last-child {
        text-align: right;
      }

      .project {
        border-bottom: 1px solid var(--rule);
      }

      .project-summary {
        align-items: start;
        min-height: 164px;
        padding: 27px 0 28px;
        cursor: pointer;
        list-style: none;
      }

      .project-summary::-webkit-details-marker {
        display: none;
      }

      .project-summary:hover .project-title {
        color: var(--signal);
      }

      .project-period {
        color: var(--signal);
        font-family: var(--display);
        font-size: 0.98rem;
        font-weight: 600;
        line-height: 1.25;
      }

      .project-heading,
      .project-overview {
        display: block;
      }

      .project-title {
        display: block;
        font-family: var(--display);
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.05;
      }

      .project-meta {
        display: grid;
        gap: 1px;
        margin-top: 10px;
        color: var(--graphite);
        font-size: 0.8rem;
        line-height: 1.35;
      }

      .project-meta strong {
        color: var(--ink);
        font-weight: 500;
      }

      .project-brief {
        display: block;
        max-width: 62ch;
        color: var(--graphite);
        font-size: 0.94rem;
        line-height: 1.48;
      }

      .project-proof {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 15px;
        font-size: 0.75rem;
      }

      .project-proof-item {
        color: var(--graphite);
      }

      .project-proof strong {
        color: var(--ink);
        font-family: var(--display);
        font-size: 0.84rem;
        font-weight: 600;
      }

      .stack-list {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 1px 0;
        color: var(--graphite);
        font-size: 0.82rem;
        line-height: 1.45;
      }

      .stack-item:not(:last-child)::after {
        margin-right: 0.28em;
        content: ",";
      }

      .disclosure-icon {
        position: relative;
        display: block;
        width: 34px;
        height: 34px;
        border: 2px solid var(--signal);
      }

      .disclosure-icon::before,
      .disclosure-icon::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 14px;
        height: 2px;
        background: var(--signal);
        content: "";
        transform: translate(-50%, -50%);
      }

      .disclosure-icon::after {
        transform: translate(-50%, -50%) rotate(90deg);
        transition: transform 140ms ease;
      }

      .project[open] > .project-summary .disclosure-icon {
        background: var(--signal);
      }

      .project[open] > .project-summary .disclosure-icon::before,
      .project[open] > .project-summary .disclosure-icon::after {
        background: #fff;
      }

      .project[open] > .project-summary .disclosure-icon::after {
        transform: translate(-50%, -50%) rotate(0);
      }

      .project-body {
        padding: 0 0 36px 129px;
      }

      .case-details {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 29px 42px;
        padding: 31px 34px 34px;
        border-left: 4px solid var(--signal);
        background: color-mix(in srgb, var(--signal-wash) 72%, var(--paper));
      }

      .detail-block h4 {
        margin: 0 0 7px;
        color: var(--signal);
        font-family: var(--display);
        font-size: 1rem;
        font-weight: 600;
      }

      .detail-block p {
        max-width: 65ch;
        margin: 0;
        color: var(--graphite);
        font-size: 0.91rem;
        line-height: 1.55;
      }

      .personal-section {
        display: grid;
        grid-template-columns: minmax(230px, 0.55fr) minmax(0, 1.45fr);
        gap: 55px;
        margin-top: 110px;
        padding-top: 35px;
        border-top: 1px solid var(--rule);
      }

      .personal-intro h2 {
        margin: 0;
        font-family: var(--display);
        font-size: 2.1rem;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .personal-intro p {
        margin: 15px 0 0;
        color: var(--graphite);
        font-size: 0.9rem;
      }

      .personal-project {
        border-top: 2px solid var(--ink);
      }

      .personal-project .project-summary {
        grid-template-columns: 105px minmax(180px, 0.8fr) minmax(260px, 1.35fr) 34px;
      }

      .personal-project .project-stack {
        display: none;
      }

      .personal-project .project-body {
        padding-left: 0;
      }

      .contact {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(260px, 0.75fr);
        align-items: end;
        gap: 70px;
        margin-top: 120px;
        padding: 53px 0 75px;
        border-top: 3px solid var(--ink);
      }

      .contact h2 {
        max-width: 760px;
        margin: 0;
        font-family: var(--display);
        font-size: clamp(3.2rem, 6vw, 6rem);
        font-weight: 600;
        letter-spacing: -0.05em;
        line-height: 0.9;
      }

      .contact-copy {
        max-width: 58ch;
        margin: 25px 0 0;
        color: var(--graphite);
        font-size: 1rem;
      }

      .contact-links {
        display: grid;
        justify-items: start;
        gap: 9px;
      }

      .contact-links a {
        border-bottom: 1px solid currentColor;
        color: var(--signal);
        font-weight: 500;
      }

      .contact-links a:first-child {
        font-family: var(--display);
        font-size: 1.25rem;
        font-weight: 600;
      }

      @media (max-width: 1050px) {
        .timeline-head {
          display: none;
        }

        .project-summary {
          grid-template-columns: 90px minmax(0, 1fr) 34px;
          grid-template-areas:
            "period heading toggle"
            ". overview ."
            ". stack .";
          gap: 18px 22px;
        }

        .project-period {
          grid-area: period;
        }

        .project-heading {
          grid-area: heading;
        }

        .project-overview {
          grid-area: overview;
        }

        .project-stack {
          grid-area: stack;
        }

        .disclosure-icon {
          grid-area: toggle;
        }

        .project-body {
          padding-left: 112px;
        }

        .personal-project .project-summary {
          grid-template-columns: 90px minmax(0, 1fr) 34px;
        }
      }

      @media (max-width: 820px) {
        .site-shell {
          width: min(100% - 38px, 680px);
        }

        .site-header {
          grid-template-columns: 1fr auto;
          gap: 14px 24px;
          padding: 19px 0;
        }

        .primary-nav {
          grid-column: 1 / -1;
          grid-row: 2;
          justify-self: start;
        }

        .hero {
          grid-template-columns: 1fr;
          gap: 55px;
          padding: 72px 0 90px;
        }

        .hero h1 {
          max-width: 700px;
        }

        .capabilities {
          max-width: 600px;
        }

        .section-intro {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .personal-section,
        .contact {
          grid-template-columns: 1fr;
        }

        .personal-section {
          gap: 30px;
        }

        .contact {
          gap: 42px;
        }
      }

      @media (max-width: 620px) {
        .site-shell {
          width: min(100% - 28px, 500px);
        }

        .site-header {
          grid-template-columns: 1fr;
        }

        .availability {
          justify-self: start;
        }

        .primary-nav {
          grid-column: 1;
          grid-row: auto;
          gap: 21px;
        }

        .hero {
          gap: 45px;
          padding: 58px 0 78px;
        }

        .hero h1 {
          font-size: clamp(3.35rem, 17vw, 4.9rem);
        }

        .capabilities div {
          grid-template-columns: 72px 1fr;
        }

        .section-intro {
          padding: 36px 0 38px;
        }

        .section-intro h2 {
          font-size: 3rem;
        }

        .project-summary {
          grid-template-columns: minmax(0, 1fr) 34px;
          grid-template-areas:
            "period toggle"
            "heading toggle"
            "overview overview"
            "stack stack";
          gap: 12px 16px;
          min-height: 0;
          padding: 24px 0 27px;
        }

        .project-title {
          font-size: 1.42rem;
        }

        .project-overview {
          margin-top: 7px;
        }

        .project-body {
          padding: 0 0 28px;
        }

        .case-details {
          grid-template-columns: 1fr;
          gap: 23px;
          padding: 25px 24px 27px;
        }

        .personal-section {
          margin-top: 80px;
        }

        .personal-project .project-summary {
          grid-template-columns: minmax(0, 1fr) 34px;
        }

        .contact {
          margin-top: 88px;
          padding: 42px 0 60px;
        }

        .contact h2 {
          font-size: clamp(3.2rem, 16vw, 4.7rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .disclosure-icon::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>


    <script>
      const projects = [
        {
          id: "anonymous-by-design",
          title: "Anonymous by design",
          client: "Personio",
          kind: "Product launch",
          period: "2023 to 2025",
          summary: "An EU-compliant whistleblowing service built around anonymous reporting and isolated infrastructure.",
          details: {
            problem: "Protect reporter anonymity while isolating the service for regulatory and operational reasons.",
            role: "I co-architected the service, started the Go codebase and AWS CDK infrastructure, then led a three-engineer maintenance team after launch.",
            decisions: "I designed dual-AWS isolation and anonymous authentication. I set up automated testing with Docker Testcontainers and Datadog synthetic monitoring.",
            result: "Soon after release, the service generated approximately €1M ARR, reached 99.92% uptime, kept p99 latency below 200ms, and resolved 14 critical security vulnerabilities."
          },
          proof: [
            ["€1M ARR", "soon after release"],
            ["99.92%", "service uptime"],
            ["<200ms", "p99 latency"]
          ],
          stack: ["Golang", "AWS CDK", "Kubernetes", "Datadog"]
        },
        {
          id: "pricing-engine",
          title: "Pricing engine extraction",
          client: "BEAT / FREENOW",
          kind: "Platform evolution",
          period: "2019 to 2023",
          summary: "I led the extraction of the core pricing engine from a monolith into Go services with dynamic, incentive-driven geo-pricing.",
          details: {
            problem: "Move a core pricing capability out of the monolith without leaving it as the permanent owner of every market decision.",
            role: "I led the pricing-service extraction and worked with the wider mobility platform around the new service boundary.",
            decisions: "I introduced dynamic, incentive-driven pricing based on hexagonal geo-zones and kept the pricing logic independently deployable.",
            result: "The separate Go pricing capability could respond to supply and demand across markets without expanding the original monolith."
          },
          proof: [
            ["Go", "new service boundary"],
            ["Geo-zones", "dynamic incentives"],
            ["Markets", "supply / demand"]
          ],
          stack: ["Golang", "Kafka", "gRPC", "AWS"]
        },
        {
          id: "gateway-migration",
          title: "API gateway migration",
          client: "BEAT / FREENOW",
          kind: "Migration",
          period: "2019 to 2023",
          summary: "Routing and authentication moved out of a monolith while the old and new paths ran in parallel.",
          details: {
            problem: "Replace routing and authentication in a live ride-hailing platform without one high-risk cutover.",
            role: "I helped form the four-engineer team, built the gateway and authentication path, and contributed to the migration strategy.",
            decisions: "I used custom Kubernetes CRDs, Helm-based service discovery, a DynamoDB-backed authentication service, and a Redis idempotency guard.",
            result: "The live migration removed the corresponding monolith functionality, and seven teams adopted the shared authorization library."
          },
          proof: [
            ["10k+ RPS", "gateway throughput"],
            ["6 to 12 months", "parallel paths"],
            ["7 teams", "authorization adopted"]
          ],
          stack: ["Golang", "Kubernetes", "DynamoDB", "Redis"]
        },
        {
          id: "survey-migration",
          title: "24 GB, zero downtime",
          client: "Personio",
          kind: "Data reliability",
          period: "2023 to 2025",
          summary: "A user-data snapshot tool and zero-downtime migration reduced P99 latency across 14 endpoints.",
          details: {
            problem: "Stop user-data snapshots from driving exponential database growth while keeping a large production dataset available.",
            role: "I led the investigation, designed the snapshot approach, and owned the zero-downtime migration.",
            decisions: "I changed the data shape and optimized PostgreSQL indexes and schema across the affected API surface.",
            result: "I migrated 24GB without downtime and reduced P99 latency from 600ms to below 300ms across 14 endpoints."
          },
          proof: [
            ["24 GB", "migrated live"],
            ["600ms to <300ms", "P99 latency"],
            ["14", "endpoints improved"]
          ],
          stack: ["Kotlin", "PostgreSQL", "Kafka", "React"]
        },
        {
          id: "messy-data",
          title: "Wholesaler data integration with fuzzy matching",
          client: "fashionTrade",
          kind: "Data integration",
          period: "2018 to 2019",
          summary: "A distributed integration API handled wholesaler data with fuzzy matching and asynchronous enrichment.",
          details: {
            problem: "Normalize inconsistent data from hundreds of fashion wholesalers without turning each integration into a manual project.",
            role: "I led the distributed data-integration API and its matching and enrichment flow.",
            decisions: "I combined Elasticsearch fuzzy matching with asynchronous Kafka pipelines and explicit race-condition handling.",
            result: "The service ingested, disambiguated, enriched, and mapped wholesaler data onto the master dataset through a repeatable flow."
          },
          proof: [
            ["Hundreds", "of wholesalers"],
            ["Fuzzy", "matching + enrichment"],
            ["Kafka", "race handling"]
          ],
          stack: ["Java", "Elasticsearch", "Kafka", "GCP"]
        },
        {
          id: "developer-accelerator",
          title: "Java CMS integration framework",
          client: "SDL Web",
          kind: "Open source",
          period: "2015 to 2018",
          summary: "A Java framework for integrating customer models with an open-source enterprise CMS.",
          details: {
            problem: "Reduce repeated implementation work when connecting customer models to an enterprise CMS.",
            role: "I led development of the Java framework and reviewed and integrated community contributions.",
            decisions: "I implemented reflection-based dynamic model mapping and maintained the adapter framework alongside customer needs.",
            result: "The framework gave customers a shorter, more repeatable path to integrations around the open-source CMS."
          },
          proof: [
            ["Java", "adapter framework"],
            ["Dynamic", "model mapping"],
            ["OSS", "community input"]
          ],
          stack: ["Java", "Spring", "Gradle", "OSS"]
        },
        {
          id: "ai-lab",
          title: "Independent AI tooling experiments",
          client: "Personal work",
          kind: "In progress",
          period: "2026 to now",
          summary: "A private space for experiments with AI-assisted development, MCP, and developer workflows.",
          details: {
            problem: "Test useful, repeatable ways to work with AI tools without presenting experiments as production work.",
            role: "Independent exploration during a sabbatical focused on personal projects and AI engineering.",
            decisions: "I am experimenting with OpenAI APIs, MCP, Claude Code, and developer tooling. The public version is not defined yet.",
            result: "Private and still forming. This slot stays visible so a future public project has a clear home without inventing one now."
          },
          proof: [
            ["MCP", "tool interfaces"],
            ["LLM APIs", "experiments"],
            ["Private", "still forming"]
          ],
          stack: ["OpenAI API", "MCP", "Claude Code", "Developer tooling"],
          personal: true
        }
      ];


      const app = document.querySelector("#app");

      const esc = (value) => String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);

      const detailLabels = {
        problem: "The problem",
        role: "My ownership",
        decisions: "Technical decisions",
        result: "Result"
      };

      const proof = (items) => `
        <span class="project-proof">
          ${items.map(([value, text]) => `<span class="project-proof-item"><strong>${esc(value)}</strong> ${esc(text)}</span>`).join("")}
        </span>
      `;

      const stack = (items) => `
        <span class="stack-list">
          ${items.map((item) => `<span class="stack-item">${esc(item)}</span>`).join("")}
        </span>
      `;

      const caseDetails = (project) => `
        <div class="project-body">
          <div class="case-details">
            ${Object.entries(project.details).map(([key, value]) => `
              <div class="detail-block">
                <h4>${detailLabels[key]}</h4>
                <p>${esc(value)}</p>
              </div>
            `).join("")}
          </div>
        </div>
      `;

      const renderProject = (project, className = "") => `
        <details class="project ${className}" id="${esc(project.id)}">
          <summary class="project-summary">
            <span class="project-period">${esc(project.period.replace(" to ", "–"))}</span>
            <span class="project-heading">
              <span class="project-title" id="${esc(project.id)}-title" role="heading" aria-level="3">${esc(project.title)}</span>
              <span class="project-meta"><strong>${esc(project.client)}</strong><span>${esc(project.kind)}</span></span>
            </span>
            <span class="project-overview">
              <span class="project-brief">${esc(project.summary)}</span>
              ${proof(project.proof)}
            </span>
            <span class="project-stack"><span class="visually-hidden">Technologies: </span>${stack(project.stack)}</span>
            <span class="disclosure-icon" aria-hidden="true"></span>
          </summary>
          ${caseDetails(project)}
        </details>
      `;

      const professionalProjects = projects
        .filter((project) => !project.personal)
        .sort((left, right) => right.period.localeCompare(left.period));
      const personalProjects = projects.filter((project) => project.personal);

      const header = () => `
        <header class="site-header">
          <a class="brand" href="#top" aria-label="Alexey Zarakovskiy home">
            <span class="brand-name">Alexey Zarakovskiy</span>
            <span class="brand-role">Senior software engineer</span>
          </a>
          <nav class="primary-nav" aria-label="Primary navigation">
            <a href="#work">Work</a>
            <a href="#expertise">Expertise</a>
            <a href="#contact">Contact</a>
          </nav>
          <a class="availability" href="#contact">Available for freelance work</a>
        </header>
      `;

      const personalWork = () => personalProjects.length ? `
        <section class="personal-section" aria-labelledby="personal-title">
          <div class="personal-intro">
            <h2 id="personal-title">In the lab</h2>
            <p>Independent experiments, kept separate from client work. Public notes and demos will appear here when they are ready.</p>
          </div>
          <div>
            ${personalProjects.map((project) => renderProject(project, "personal-project")).join("")}
          </div>
        </section>
      ` : "";

      const contact = () => `
        <section class="contact" id="contact" aria-labelledby="contact-title">
          <div>
            <h2 id="contact-title">Bring me the difficult part.</h2>
            <p class="contact-copy">Backend, platform, or full-stack. A new build, a migration, a performance problem, or a system that needs a clear owner.</p>
          </div>
          <div class="contact-links">
            <a href="mailto:work@azarakovskiy.com">work@azarakovskiy.com</a>
            <a href="https://linkedin.com/in/azarakovskiy">LinkedIn</a>
            <a href="https://github.com/azarakovskiy">GitHub</a>
          </div>
        </section>
      `;

      const renderPage = () => `
        <div class="site-shell" id="top">
          ${header()}
          <main>
            <section class="hero" aria-labelledby="hero-title">
              <div>
                <h1 id="hero-title">I make difficult software easier to ship, run, and change.</h1>
                <p class="hero-lede">I take on backend, platform, and full-stack work from architecture through production ownership. Ten-plus years across HR, mobility, commerce, and enterprise products.</p>
                <div class="hero-actions">
                  <a class="primary-link" href="mailto:work@azarakovskiy.com">Discuss a project</a>
                  <a class="text-link" href="#work">View selected work</a>
                </div>
              </div>
              <dl class="capabilities" id="expertise">
                <div><dt>Systems</dt><dd>Distributed services, APIs, data models, cloud infrastructure</dd></div>
                <div><dt>Delivery</dt><dd>Architecture, migrations, production ownership, team leadership</dd></div>
                <div><dt>Tools</dt><dd>Go, Java and Kotlin, TypeScript and React, AWS and Kubernetes</dd></div>
                <div><dt>Focus</dt><dd>Performance, reliability, security, maintainability</dd></div>
              </dl>
            </section>

            <section class="work" id="work" aria-labelledby="work-title">
              <div class="section-intro">
                <h2 id="work-title">Selected project work</h2>
                <p>Professional work, newest first. Open a project for the problem, my ownership, the technical decisions, and the result.</p>
              </div>
              <div class="timeline">
                <div class="timeline-head" aria-hidden="true">
                  <span>Years</span><span>Project</span><span>Scope and evidence</span><span>Technologies</span><span>Open</span>
                </div>
                ${professionalProjects.map((project) => renderProject(project)).join("")}
              </div>
            </section>

            ${personalWork()}
            ${contact()}
          </main>
        </div>
      `;

      app.innerHTML = renderPage();
    </script>
  </body>
</html>
