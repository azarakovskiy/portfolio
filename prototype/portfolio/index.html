<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Freelance software developer portfolio for Alexey Zarakovskiy, covering backend, platform, full-stack, and production engineering work."
    />
    <meta name="color-scheme" content="light" />
    <title>Alexey Zarakovskiy — Senior software engineer</title>
    <style>
      /*
       * THROWAWAY UI PROTOTYPE
       * Question: which resume-native version of B3 makes project evidence
       * easiest to scan and understand?
       * Three B3-derived variants, switchable via ?variant=B3, B4, or B5.
       */
      :root {
        color-scheme: light;
        --ink: #11181c;
        --ink-soft: #3c4752;
        --ink-faint: #7b8794;
        --rule: #dce3e2;
        --accent: #059669;
        --accent-dark: #065f46;
        --accent-soft: #d1fae5;
        --surface: #ffffff;
        --canvas: #f4f5f7;
        --sans:
          "Liberation Sans", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif;
        --mono: "Liberation Mono", "Courier New", monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        margin: 0;
        padding-bottom: 86px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.5;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        color: var(--accent-dark);
      }

      button {
        font: inherit;
      }

      a:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      ::selection {
        background: var(--accent-soft);
        color: var(--ink);
      }

      .page {
        width: min(1040px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 48px 38px 70px;
        background: var(--surface);
      }

      .identity-name {
        margin: 0 0 5px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.015em;
        line-height: 1.1;
      }

      .identity-tagline {
        margin: 0 0 11px;
        color: var(--ink-soft);
        font-size: 15px;
      }

      .contact-list {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        color: var(--ink-soft);
        font-size: 12.5px;
      }

      .contact-list > span {
        white-space: nowrap;
      }

      .contact-label {
        margin-right: 3px;
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .section {
        margin-top: 25px;
      }

      .route {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
        color: var(--accent-dark);
        font-family: var(--mono);
        font-size: 11.5px;
        letter-spacing: 0.02em;
      }

      .route::after {
        height: 1px;
        background: var(--rule);
        content: "";
        flex: 1;
      }

      .profile-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 28px;
      }

      .profile-copy {
        max-width: 76ch;
        margin: 0;
        color: var(--ink-soft);
        font-size: 13.5px;
      }

      .availability {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        color: var(--ink-soft);
        font-size: 12px;
      }

      .availability::before {
        width: 8px;
        height: 8px;
        border: 2px solid var(--accent);
        border-radius: 50%;
        background: var(--surface);
        content: "";
        flex: none;
      }

      .work-heading {
        display: grid;
        grid-template-columns: minmax(220px, 0.72fr) minmax(320px, 1.28fr);
        align-items: end;
        gap: 34px;
        margin-bottom: 17px;
      }

      .work-heading h2 {
        margin: 0;
        font-size: 21px;
        line-height: 1.15;
      }

      .work-heading p {
        max-width: 66ch;
        margin: 0;
        color: var(--ink-soft);
        font-size: 12.5px;
      }

      .project-tabs {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        border-top: 1px solid var(--rule);
        border-left: 1px solid var(--rule);
      }

      .project-tab {
        display: grid;
        align-content: space-between;
        gap: 15px;
        min-width: 0;
        min-height: 112px;
        padding: 12px 11px 13px;
        border: 0;
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        background: var(--surface);
        color: inherit;
        cursor: pointer;
        text-align: left;
      }

      .project-tab:hover {
        background: color-mix(in srgb, var(--accent-soft) 38%, var(--surface));
      }

      .project-tab[aria-pressed="true"] {
        background: var(--accent-soft);
        box-shadow: inset 0 -3px 0 var(--accent);
      }

      .project-tab-period {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 9.5px;
        white-space: nowrap;
      }

      .project-tab-copy {
        display: grid;
        gap: 3px;
      }

      .project-tab-title {
        font-size: 12.5px;
        font-weight: 700;
        line-height: 1.2;
      }

      .project-tab-client {
        color: var(--ink-faint);
        font-size: 10.5px;
        line-height: 1.25;
      }

      .reader {
        scroll-margin-top: 20px;
      }

      .case-columns {
        display: grid;
        grid-template-columns: 145px minmax(0, 1fr) 220px;
        align-items: start;
        gap: 34px;
        padding-top: 32px;
      }

      .case-context {
        position: relative;
        display: grid;
        gap: 5px;
        padding-left: 18px;
        border-left: 2px solid var(--rule);
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 10.5px;
      }

      .case-context::before {
        position: absolute;
        top: 2px;
        left: -6px;
        width: 10px;
        height: 10px;
        border: 2px solid var(--accent);
        border-radius: 50%;
        background: var(--surface);
        content: "";
      }

      .case-context strong {
        color: var(--ink);
        font-family: var(--sans);
        font-size: 13.5px;
      }

      .case-main h3 {
        margin: 0;
        font-size: 27px;
        letter-spacing: -0.015em;
        line-height: 1.08;
      }

      .case-summary {
        max-width: 66ch;
        margin: 8px 0 21px;
        color: var(--ink-soft);
        font-size: 13.5px;
      }

      .case-detail {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        gap: 18px;
        padding: 14px 0 15px;
        border-top: 1px solid var(--rule);
      }

      .case-detail h4 {
        margin: 1px 0 0;
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 9.5px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .case-detail p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 12.5px;
      }

      .case-evidence {
        position: sticky;
        top: 18px;
        padding: 15px 0 0 17px;
        border-top: 2px solid var(--accent);
        border-left: 1px solid var(--rule);
      }

      .rail-heading {
        margin: 0 0 11px;
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 9.5px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .proof-list {
        display: grid;
        gap: 12px;
      }

      .proof-item {
        display: grid;
        gap: 1px;
        color: var(--ink-soft);
        font-size: 10.5px;
      }

      .proof-item strong {
        color: var(--ink);
        font-family: var(--mono);
        font-size: 13px;
      }

      .technology-group {
        margin-top: 23px;
        padding-top: 14px;
        border-top: 1px solid var(--rule);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .tag {
        padding: 3px 7px;
        border: 1px solid var(--rule);
        border-radius: 3px;
        background: var(--surface);
        color: var(--ink-soft);
        font-size: 10.5px;
        font-weight: 500;
        line-height: 1.3;
      }

      .resume-entry {
        position: relative;
        margin: 32px 0 0;
        padding: 0 0 2px 20px;
        border-left: 2px solid var(--rule);
      }

      .resume-entry::before {
        position: absolute;
        top: 5px;
        left: -6px;
        width: 10px;
        height: 10px;
        border: 2px solid var(--accent);
        border-radius: 50%;
        background: var(--surface);
        content: "";
      }

      .resume-entry-head {
        display: flex;
        align-items: baseline;
        gap: 5px 14px;
        flex-wrap: wrap;
        margin-bottom: 2px;
      }

      .resume-entry-head h3 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
      }

      .resume-entry-kind,
      .resume-entry-date {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 10.5px;
      }

      .resume-entry-kind {
        margin-right: auto;
      }

      .resume-entry-summary {
        max-width: 82ch;
        margin: 0 0 12px;
        color: var(--ink-soft);
        font-size: 12.5px;
      }

      .resume-project-title {
        margin: 0 0 7px;
        padding-left: 8px;
        border-left: 2px solid var(--accent);
        font-size: 14px;
        font-weight: 700;
        line-height: 1.3;
      }

      .resume-project-title .tag {
        margin-left: 7px;
        vertical-align: 1px;
      }

      .resume-bullets {
        margin: 0;
        padding-left: 17px;
      }

      .resume-bullets li {
        margin-bottom: 7px;
        color: var(--ink-soft);
        font-size: 12.5px;
      }

      .resume-bullets li::marker {
        color: var(--ink-faint);
      }

      .resume-bullets strong {
        color: var(--ink);
        font-weight: 600;
      }

      .resume-evidence {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 17px;
        margin-top: 13px;
        padding-top: 11px;
        border-top: 1px solid var(--rule);
        color: var(--ink-soft);
        font-size: 10.5px;
      }

      .resume-evidence strong {
        color: var(--ink);
        font-family: var(--mono);
        font-size: 11.5px;
      }

      .resume-technologies {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 0;
        margin-top: 10px;
        color: var(--ink-faint);
        font-size: 10.5px;
      }

      .resume-technology:not(:last-child)::after {
        margin: 0 7px 0 4px;
        content: "·";
      }

      .case-sheet {
        margin-top: 32px;
        border: 1px solid var(--rule);
      }

      .case-sheet-head {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 28px;
        padding: 21px 22px 20px;
        border-bottom: 1px solid var(--rule);
      }

      .sheet-meta {
        display: grid;
        align-content: start;
        gap: 4px;
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 10.5px;
      }

      .sheet-meta strong {
        color: var(--ink);
        font-family: var(--sans);
        font-size: 13.5px;
      }

      .sheet-title h3 {
        margin: 0;
        font-size: 25px;
        letter-spacing: -0.012em;
        line-height: 1.1;
      }

      .sheet-title p {
        max-width: 68ch;
        margin: 7px 0 0;
        color: var(--ink-soft);
        font-size: 12.5px;
      }

      .sheet-proof {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-bottom: 1px solid var(--rule);
        background: color-mix(in srgb, var(--accent-soft) 24%, var(--surface));
      }

      .sheet-proof .proof-item {
        min-height: 70px;
        padding: 14px 22px;
        border-right: 1px solid var(--rule);
      }

      .sheet-proof .proof-item:last-child {
        border-right: 0;
      }

      .sheet-proof .proof-item strong {
        color: var(--accent-dark);
        font-size: 14px;
      }

      .sheet-details {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .sheet-details .case-detail {
        display: block;
        min-height: 142px;
        padding: 19px 22px 21px;
        border-top: 0;
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
      }

      .sheet-details .case-detail:nth-child(even) {
        border-right: 0;
      }

      .sheet-details .case-detail:nth-last-child(-n + 2) {
        border-bottom: 0;
      }

      .sheet-details .case-detail h4 {
        margin: 0 0 8px;
      }

      .sheet-footer {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 28px;
        padding: 14px 22px 15px;
        border-top: 1px solid var(--rule);
      }

      .sheet-footer strong {
        color: var(--ink-faint);
        font-family: var(--mono);
        font-size: 9.5px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .footer {
        margin-top: 38px;
      }

      .footer p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 12.5px;
      }

      .footer a {
        border-bottom: 1px solid currentColor;
        color: var(--accent-dark);
        font-weight: 600;
      }

      .prototype-switcher {
        position: fixed;
        z-index: 20;
        bottom: max(14px, env(safe-area-inset-bottom));
        left: 50%;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        width: min(390px, calc(100% - 24px));
        overflow: hidden;
        border: 1px solid var(--ink);
        border-radius: 4px;
        background: var(--ink);
        box-shadow: 0 10px 30px rgb(17 24 28 / 20%);
        color: var(--surface);
        transform: translateX(-50%);
      }

      .prototype-switcher button {
        min-height: 46px;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 16px;
      }

      .prototype-switcher button:hover {
        background: var(--accent-dark);
      }

      .prototype-switcher output {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 9px;
        min-width: 0;
        padding: 0 12px;
        border-right: 1px solid var(--ink-soft);
        border-left: 1px solid var(--ink-soft);
        font-size: 11px;
        line-height: 1.15;
      }

      .prototype-switcher strong {
        color: #6ee7b7;
        font-family: var(--mono);
        font-size: 12px;
      }

      .prototype-switcher span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (max-width: 860px) {
        .page {
          padding-right: 28px;
          padding-left: 28px;
        }

        .project-tabs {
          grid-auto-columns: minmax(150px, 1fr);
          grid-auto-flow: column;
          grid-template-columns: none;
          overflow-x: auto;
        }

        .case-columns {
          grid-template-columns: 135px minmax(0, 1fr);
        }

        .case-evidence {
          position: static;
          grid-column: 2;
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          gap: 26px;
        }

        .technology-group {
          margin-top: 0;
          padding-top: 0;
          border-top: 0;
        }
      }

      @media (max-width: 640px) {
        body {
          background: var(--surface);
        }

        .page {
          padding: 29px 18px 56px;
        }

        .identity-name {
          font-size: 27px;
        }

        .identity-tagline {
          font-size: 14px;
        }

        .contact-list {
          display: grid;
          gap: 3px;
          font-size: 12px;
        }

        .profile-row,
        .work-heading,
        .case-columns,
        .case-sheet-head,
        .sheet-footer {
          grid-template-columns: 1fr;
        }

        .profile-row,
        .work-heading {
          gap: 10px;
        }

        .availability {
          white-space: normal;
        }

        .project-tabs {
          grid-auto-columns: 164px;
        }

        .project-tab {
          min-height: 102px;
        }

        .case-columns {
          gap: 24px;
          padding-top: 26px;
        }

        .case-context {
          display: flex;
          flex-wrap: wrap;
          gap: 3px 12px;
        }

        .case-main h3 {
          font-size: 24px;
        }

        .case-detail {
          grid-template-columns: 1fr;
          gap: 5px;
        }

        .case-evidence {
          grid-column: 1;
          grid-template-columns: 1fr;
          gap: 0;
        }

        .technology-group {
          margin-top: 20px;
          padding-top: 13px;
          border-top: 1px solid var(--rule);
        }

        .resume-entry-head {
          display: grid;
          gap: 2px;
        }

        .resume-entry-kind {
          margin-right: 0;
        }

        .case-sheet-head,
        .sheet-footer {
          gap: 10px;
        }

        .sheet-proof,
        .sheet-details {
          grid-template-columns: 1fr;
        }

        .sheet-proof .proof-item,
        .sheet-proof .proof-item:last-child {
          min-height: 0;
          border-right: 0;
          border-bottom: 1px solid var(--rule);
        }

        .sheet-proof .proof-item:last-child {
          border-bottom: 0;
        }

        .sheet-details .case-detail,
        .sheet-details .case-detail:nth-child(even),
        .sheet-details .case-detail:nth-last-child(-n + 2) {
          min-height: 0;
          border-right: 0;
          border-bottom: 1px solid var(--rule);
        }

        .sheet-details .case-detail:last-child {
          border-bottom: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>


    <script>
      const projects = [
        {
          id: "anonymous-by-design",
          title: "Anonymous by design",

        {

          },
          proof: [
            ["24 GB", "migrated live"],
            ["600ms to <300ms", "P99 latency"],
            ["14", "endpoints improved"]
          ],
          stack: ["Kotlin", "PostgreSQL", "Kafka", "React"]
        },
        {
          id: "messy-data",
          title: "Wholesaler data integration with fuzzy matching",
          client: "fashionTrade",
          kind: "Data integration",
          period: "2018 to 2019",
          summary: "A distributed integration API handled wholesaler data with fuzzy matching and asynchronous enrichment.",
          details: {
            problem: "Normalize inconsistent data from hundreds of fashion wholesalers without turning each integration into a manual project.",
            role: "I led the distributed data-integration API and its matching and enrichment flow.",
            decisions: "I combined Elasticsearch fuzzy matching with asynchronous Kafka pipelines and explicit race-condition handling.",
            result: "The service ingested, disambiguated, enriched, and mapped wholesaler data onto the master dataset through a repeatable flow."
          },
          proof: [
            ["Hundreds", "of wholesalers"],
            ["Fuzzy", "matching + enrichment"],
            ["Kafka", "race handling"]
          ],
          stack: ["Java", "Elasticsearch", "Kafka", "GCP"]
        },
        {
          id: "developer-accelerator",
          title: "Java CMS integration framework",
          client: "SDL Web",
          kind: "Open source",
          period: "2015 to 2018",
          summary: "A Java framework for integrating customer models with an open-source enterprise CMS.",
          details: {
            problem: "Reduce repeated implementation work when connecting customer models to an enterprise CMS.",
            role: "I led development of the Java framework and reviewed and integrated community contributions.",
            decisions: "I implemented reflection-based dynamic model mapping and maintained the adapter framework alongside customer needs.",
            result: "The framework gave customers a shorter, more repeatable path to integrations around the open-source CMS."
          },
          proof: [
            ["Java", "adapter framework"],
            ["Dynamic", "model mapping"],
            ["OSS", "community input"]
          ],
          stack: ["Java", "Spring", "Gradle", "OSS"]
        },
        {
          id: "ai-lab",
          title: "Independent AI tooling experiments",
          client: "Personal work",
          kind: "In progress",
          period: "2026 to now",
          summary: "A private space for experiments with AI-assisted development, MCP, and developer workflows.",
          details: {
            problem: "Test useful, repeatable ways to work with AI tools without presenting experiments as production work.",
            role: "Independent exploration during a sabbatical focused on personal projects and AI engineering.",
            decisions: "I am experimenting with OpenAI APIs, MCP, Claude Code, and developer tooling. The public version is not defined yet.",
            result: "Private and still forming. This slot stays visible so a future public project has a clear home without inventing one now."
          },
          proof: [
            ["MCP", "tool interfaces"],
            ["LLM APIs", "experiments"],
            ["Private", "still forming"]
          ],
          stack: ["OpenAI API", "MCP", "Claude Code", "Developer tooling"],
          personal: true
        }
      ];


      const app = document.querySelector("#app");

      const esc = (value) => String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);

      const detailLabels = {
        problem: "The problem",
        role: "My ownership",
        decisions: "Technical decisions",
        result: "Result"
      };

      const professionalProjects = projects
        .filter((project) => !project.personal)
        .sort((left, right) => right.period.localeCompare(left.period));
      const personalProjects = projects.filter((project) => project.personal);
      const prototypeProjects = [...professionalProjects, ...personalProjects];

      const variantNames = {
        B3: "Case columns",
        B4: "Resume entry",
        B5: "Evidence sheet"
      };
      const variantKeys = Object.keys(variantNames);
      const urlState = new URLSearchParams(window.location.search);
      const requestedVariant = urlState.get("variant")?.toUpperCase();
      let currentVariant = variantNames[requestedVariant] ? requestedVariant : "B3";
      let selectedProjectId = prototypeProjects.some(({ id }) => id === urlState.get("case"))
        ? urlState.get("case")
        : prototypeProjects[0].id;

      const selectedProject = () =>
        prototypeProjects.find(({ id }) => id === selectedProjectId) || prototypeProjects[0];

      const period = (project) => project.period.replace(" to ", " – ");

      const identity = () => `
        <header class="identity" id="top">
          <h1 class="identity-name">Alexey Zarakovskiy</h1>
          <p class="identity-tagline">Senior Backend Engineer; full-stack; language and technology agnostic</p>
          <div class="contact-list">
            <span><span class="contact-label">Email</span><a href="mailto:work@azarakovskiy.com">work@azarakovskiy.com</a></span>
            <span><span class="contact-label">LinkedIn</span><a href="https://linkedin.com/in/azarakovskiy">linkedin.com/in/azarakovskiy</a></span>
            <span><span class="contact-label">GitHub</span><a href="https://github.com/azarakovskiy">github.com/azarakovskiy</a></span>
          </div>
        </header>
      `;

      const profile = () => `
        <section class="section" aria-labelledby="profile-title">
          <div class="route" id="profile-title">/portfolio</div>
          <div class="profile-row">
            <p class="profile-copy">Selected project evidence from product launches, migrations, platform evolution, and data systems. Choose a case to read the problem, ownership, technical decisions, and result.</p>
            <a class="availability" href="mailto:work@azarakovskiy.com">Available for freelance work</a>
          </div>
        </section>
      `;

      const footer = () => `
        <footer class="footer">
          <div class="route">/contact</div>
          <p>Backend, platform, or full-stack work: <a href="mailto:work@azarakovskiy.com">work@azarakovskiy.com</a></p>
        </footer>
      `;

      const projectTab = (project) => `
        <button
          class="project-tab"
          type="button"
          data-case="${esc(project.id)}"
          aria-controls="case-reader"
          aria-pressed="${project.id === selectedProjectId}"
        >
          <span class="project-tab-period">${esc(period(project))}</span>
          <span class="project-tab-copy">
            <span class="project-tab-title">${esc(project.title)}</span>
            <span class="project-tab-client">${esc(project.personal ? "In the lab" : project.client)}</span>
          </span>
        </button>
      `;

      const projectTabs = () => `
        <nav class="project-tabs" aria-label="Project case tabs">
          ${prototypeProjects.map(projectTab).join("")}
        </nav>
      `;

      const tags = (items) => `
        <span class="tags">
          ${items.map((item) => `<span class="tag">${esc(item)}</span>`).join("")}
        </span>
      `;

      const proof = (items, className = "proof-list") => `
        <div class="${className}">
          ${items.map(([value, label]) => `
            <span class="proof-item">
              <strong>${esc(value)}</strong>
              <span>${esc(label)}</span>
            </span>
          `).join("")}
        </div>
      `;

      const caseDetails = (project) => Object.entries(project.details).map(([key, value]) => `
        <section class="case-detail">
          <h4>${detailLabels[key]}</h4>
          <p>${esc(value)}</p>
        </section>
      `).join("");

      const workShell = (note, reader) => `
        <div class="page">
          ${identity()}
          ${profile()}
          <main>
            <section class="section" id="work" aria-labelledby="work-title">
              <div class="route">/selected-work</div>
              <header class="work-heading">
                <h2 id="work-title">Project case files</h2>
                <p>${esc(note)}</p>
              </header>
              ${projectTabs()}
              ${reader}
            </section>
          </main>
          ${footer()}
        </div>
      `;

      const caseColumns = (project) => `
        <article class="reader case-columns" id="case-reader" aria-live="polite" aria-labelledby="case-reader-title">
          <div class="case-context">
            <strong>${esc(project.client)}</strong>
            <span>${esc(project.kind)}</span>
            <span>${esc(period(project))}</span>
          </div>
          <div class="case-main">
            <h3 id="case-reader-title">${esc(project.title)}</h3>
            <p class="case-summary">${esc(project.summary)}</p>
            <div>${caseDetails(project)}</div>
          </div>
          <aside class="case-evidence" aria-label="Evidence and technologies">
            <div>
              <h4 class="rail-heading">Evidence</h4>
              ${proof(project.proof)}
            </div>
            <div class="technology-group">
              <h4 class="rail-heading">Technologies</h4>
              ${tags(project.stack)}
            </div>
          </aside>
        </article>
      `;

      const resumeEntry = (project) => `
        <article class="reader resume-entry" id="case-reader" aria-live="polite" aria-labelledby="case-reader-title">
          <header class="resume-entry-head">
            <h3>${esc(project.client)}</h3>
            <span class="resume-entry-kind">${esc(project.personal ? "In the lab" : project.kind)}</span>
            <span class="resume-entry-date">${esc(period(project))}</span>
          </header>
          <p class="resume-entry-summary">${esc(project.summary)}</p>
          <div class="resume-project-title">
            <span id="case-reader-title">${esc(project.title)}</span>
            <span class="tag">${esc(project.stack[0])}</span>
          </div>
          <ul class="resume-bullets">
            ${Object.entries(project.details).map(([key, value]) => `
              <li><strong>${detailLabels[key]}:</strong> ${esc(value)}</li>
            `).join("")}
          </ul>
          <div class="resume-evidence">
            ${project.proof.map(([value, label]) => `<span><strong>${esc(value)}</strong> ${esc(label)}</span>`).join("")}
          </div>
          <div class="resume-technologies">
            ${project.stack.map((item) => `<span class="resume-technology">${esc(item)}</span>`).join("")}
          </div>
        </article>
      `;

      const evidenceSheet = (project) => `
        <article class="reader case-sheet" id="case-reader" aria-live="polite" aria-labelledby="case-reader-title">
          <header class="case-sheet-head">
            <div class="sheet-meta">
              <strong>${esc(project.client)}</strong>
              <span>${esc(project.kind)}</span>
              <span>${esc(period(project))}</span>
            </div>
            <div class="sheet-title">
              <h3 id="case-reader-title">${esc(project.title)}</h3>
              <p>${esc(project.summary)}</p>
            </div>
          </header>
          ${proof(project.proof, "sheet-proof")}
          <div class="sheet-details">${caseDetails(project)}</div>
          <footer class="sheet-footer">
            <strong>Technologies</strong>
            ${tags(project.stack)}
          </footer>
        </article>
      `;

      const pages = {
        B3: () => workShell(
          "The B3 structure, redrawn in the resume’s visual language: context, narrative, and evidence stay in parallel columns.",
          caseColumns(selectedProject())
        ),
        B4: () => workShell(
          "The selected case reads like an expanded resume entry, keeping the familiar timeline, project marker, bullets, and inline evidence.",
          resumeEntry(selectedProject())
        ),
        B5: () => workShell(
          "The same tabbed desk with outcomes promoted into a compact strip before the case breakdown.",
          evidenceSheet(selectedProject())
        )
      };

      const prototypeSwitcher = () => {
        const state = `${variantNames[currentVariant]}: ${selectedProject().title}`;
        return `
          <aside class="prototype-switcher" aria-label="Prototype variants">
            <button type="button" data-variant-step="-1" aria-label="Previous variant">&#8592;</button>
            <output aria-live="polite">
              <strong>${currentVariant}</strong>
              <span title="${esc(state)}">${esc(state)}</span>
            </output>
            <button type="button" data-variant-step="1" aria-label="Next variant">&#8594;</button>
          </aside>
        `;
      };

      const updateUrl = () => {
        const url = new URL(window.location.href);
        url.searchParams.set("variant", currentVariant);
        url.searchParams.set("case", selectedProjectId);
        window.history.replaceState(null, "", url);
      };

      const render = () => {
        document.body.dataset.variant = currentVariant;
        app.innerHTML = `${pages[currentVariant]()}${prototypeSwitcher()}`;
      };

      const changeVariant = (step) => {
        const currentIndex = variantKeys.indexOf(currentVariant);
        currentVariant = variantKeys[(currentIndex + step + variantKeys.length) % variantKeys.length];
        updateUrl();
        render();
        window.scrollTo(0, 0);
      };

      const changeCase = (projectId) => {
        selectedProjectId = projectId;
        updateUrl();
        render();
        document.querySelector(`[data-case="${CSS.escape(projectId)}"]`)?.focus();
      };

      app.addEventListener("click", (event) => {
        const variantButton = event.target.closest("[data-variant-step]");

        if (variantButton) {
          const step = Number(variantButton.dataset.variantStep);
          changeVariant(step);
          document.querySelector(`[data-variant-step="${step}"]`)?.focus();
          return;
        }

        const caseButton = event.target.closest("[data-case]");
        if (caseButton) changeCase(caseButton.dataset.case);
      });

      window.addEventListener("keydown", (event) => {
        if (
          event.altKey ||
          event.ctrlKey ||
          event.metaKey ||
          event.shiftKey ||
          event.target.closest("input, textarea, [contenteditable]")
        ) return;

        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
          changeVariant(event.key === "ArrowLeft" ? -1 : 1);
          return;
        }

        if (event.key === "ArrowUp" || event.key === "ArrowDown") {
          const currentIndex = prototypeProjects.findIndex(({ id }) => id === selectedProjectId);
          const nextIndex = Math.max(
            0,
            Math.min(
              prototypeProjects.length - 1,
              currentIndex + (event.key === "ArrowUp" ? -1 : 1)
            )
          );

          if (nextIndex !== currentIndex) {
            event.preventDefault();
            changeCase(prototypeProjects[nextIndex].id);
          }
        }
      });

      updateUrl();
      render();
    </script>
  </body>
</html>
